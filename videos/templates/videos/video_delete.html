{% extends 'base.html' %}
{% block title %}Delete Video - YouClone{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-xl-5">

            <div class="card bg-dark border-danger shadow text-center p-5">
                <i class="bi bi-exclamation-triangle text-danger fs-1 mb-4"></i>

                <h3 class="text-danger mb-4">Delete Video?</h3>

                <p class="lead mb-4">
                    Are you sure you want to delete <strong>"{{ video.title }}"</strong>?<br>
                    This action cannot be undone.
                </p>

                <form method="post" class="d-grid gap-3">
                    {% csrf_token %}

                    <button type="submit" class="btn btn-danger btn-lg">
                        <i class="bi bi-trash me-2"></i> Yes, Delete Video
                    </button>

                    <a href="{{ video.get_absolute_url }}" class="btn btn-outline-secondary btn-lg">
                        Cancel
                    </a>
                </form>

            </div>

        </div>
    </div>
</div>

{% endblock %}

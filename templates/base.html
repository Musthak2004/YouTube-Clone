<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Roboto Font (YouTube uses this) -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background-color: #0f0f0f;
            color: #f1f1f1;
        }
        .navbar {
            background-color: #0f0f0f !important;
            border-bottom: 1px solid #303030;
            height: 56px;
        }
        .sidebar {
            position: fixed;
            top: 56px;
            left: 0;
            bottom: 0;
            width: 240px;
            background-color: #0f0f0f;
            border-right: 1px solid #303030;
            overflow-y: auto;
            transition: width 0.3s;
            z-index: 1000;
        }
        .sidebar-mini {
            width: 72px;
        }
        .sidebar-mini .sidebar-text {
            display: none;
        }
        .sidebar-item {
            padding: 8px 24px;
            white-space: nowrap;
        }
        .main-content {
            margin-left: 240px;
            margin-top: 56px;
            padding: 24px;
            transition: margin-left 0.3s;
        }
        .main-content-mini {
            margin-left: 72px;
        }
        .video-card img {
            aspect-ratio: 16/9;
            object-fit: cover;
        }
        .video-title {
            font-size: 1.05rem;
            font-weight: 500;
            line-height: 1.4;
        }
        @media (max-width: 991.98px) {
            .sidebar {
                width: 0;
                overflow: hidden;
            }
            .main-content {
                margin-left: 0;
            }
            /* Offcanvas for mobile sidebar */
        }
    </style>

    <title>{% block title %}YouTube Clone{% endblock %}</title>
</head>
<body>

    <!-- Top Navbar - Exact YouTube style -->
    <nav class="navbar navbar-expand navbar-dark fixed-top">
        <div class="container-fluid px-3">
            <!-- Left: Menu + Logo -->
            <div class="d-flex align-items-center">
                <button class="btn btn-link text-white me-3" id="sidebarToggle" type="button">
                    <i class="bi bi-list fs-4"></i>
                </button>
                <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
                    <i class="bi bi-youtube text-danger fs-3 me-1"></i>
                    <span class="fs-4 fw-bold">YouTube-Clone</span>
                </a>
            </div>

            <!-- Center: Search -->
            <div class="mx-auto d-none d-md-flex" style="max-width: 650px; flex: 1;">
                <form class="d-flex w-100" role="search">
                    <input class="form-control bg-dark border-secondary text-white rounded-start-pill px-4"
                           type="search" placeholder="Search" aria-label="Search" style="height: 40px;">
                    <button class="btn btn-dark border border-start-0 border-secondary rounded-end-pill px-4" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                </form>
            </div>

            <!-- Right: Icons -->
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-link text-white d-none d-md-block">
                    <i class="bi bi-camera-video fs-5"></i>
                </button>
                <button class="btn btn-link text-white position-relative">
                    <i class="bi bi-bell fs-5"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">9+</span>
                </button>
                <a href="#" class="text-white">
                    <img src="https://via.placeholder.com/32x32?text=U" alt="User" class="rounded-circle">
                </a>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-item d-flex align-items-center active">
            <i class="bi bi-house-door-fill fs-4 me-4"></i>
            <span class="sidebar-text">Home</span>
        </div>
        <div class="sidebar-item d-flex align-items-center">
            <i class="bi bi-play-btn fs-4 me-4"></i>
            <span class="sidebar-text">Shorts</span>
        </div>
        <div class="sidebar-item d-flex align-items-center">
            <i class="bi bi-collection-play fs-4 me-4"></i>
            <span class="sidebar-text">Subscriptions</span>
        </div>
        <hr class="border-secondary mx-3 my-2">
        <div class="sidebar-item d-flex align-items-center">
            <i class="bi bi-collection fs-4 me-4"></i>
            <span class="sidebar-text">Library</span>
        </div>
        <div class="sidebar-item d-flex align-items-center">
            <i class="bi bi-clock-history fs-4 me-4"></i>
            <span class="sidebar-text">History</span>
        </div>
        <!-- More items can be added -->
    </div>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent">
        {% block content %}
        <!-- Your page content comes here (video grid, watch page, etc.) -->
        {% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>

    <!-- Sidebar Toggle Script -->
    <script>
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        const toggleBtn = document.getElementById('sidebarToggle');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('sidebar-mini');
            mainContent.classList.toggle('main-content-mini');
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>

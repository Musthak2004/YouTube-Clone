<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{% block title %}NanbaTube{% endblock %}</title>

    <!-- Tailwind CDN (development-க்கு) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ytblack:  '#0f0f0f',
                        ytdark:   '#181818',
                        ytgray:   '#272727',
                        ythover:  '#3f3f3f',
                        ytborder: '#303030',
                        yttext:   '#aaaaaa',
                        ytblue:   '#065fd4',
                    },
                    spacing: {
                        'header': '56px',
                    }
                }
            }
        }
    </script>

    <style>
        /* Hide scrollbar but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-ytblack text-gray-100 min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-ytblack border-b border-ytborder h-header flex items-center px-4 md:px-6">
        <div class="flex items-center justify-between w-full max-w-full mx-auto">

            <!-- Left: Hamburger + Logo -->
            <div class="flex items-center gap-3 md:gap-6">
                <button class="p-2 rounded-full hover:bg-ythover transition md:hidden">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                    </svg>
                </button>
                <a href="/" class="flex items-center gap-1">
                    <svg class="w-10 h-7" viewBox="0 0 576 512" fill="currentColor">
                        <path d="M549.655 124.083c-6.281-23.65-24.787-42.276-48.284-48.597C458.781 64 288 64S117.22 64 74.629 75.486c-23.497 6.322-42.003 24.947-48.284 48.597-11.412 42.867-11.412 132.305-11.412 132.305s0 89.438 11.412 132.305c6.281 23.65 24.787 41.5 48.284 47.821C117.22 448 288 448s170.78 0 213.371-11.486c23.497-6.321 42.003-24.171 48.284-47.821 11.412-42.867 11.412-132.305 11.412-132.305s0-89.438-11.412-132.305z"/>
                        <path fill="#f00" d="M232.5 329.5l142.7-82.5-142.7-82.5z"/>
                    </svg>
                    <span class="text-xl font-bold hidden sm:block">NanbaTube</span>
                </a>
            </div>

            <!-- Center: Search bar (desktop only) -->
            <div class="hidden md:flex flex-1 max-w-2xl mx-6 lg:mx-12">
                <div class="w-full flex rounded-full overflow-hidden border border-ytborder focus-within:border-ytblue">
                    <input
                        type="text"
                        placeholder="Search"
                        class="flex-1 bg-ytgray px-5 py-2.5 outline-none text-white placeholder-yttext"
                    />
                    <button class="bg-ytgray px-6 hover:bg-ythover transition">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Right: Icons + Profile -->
            <div class="flex items-center gap-2 md:gap-4">
                <button class="p-2 rounded-full hover:bg-ythover md:hidden">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                </button>
                <button class="p-2 rounded-full hover:bg-ythover hidden md:block">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                    </svg>
                </button>
                <button class="p-2 rounded-full hover:bg-ythover">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 2v.67l-8 4.89-8-4.89V6h16zm-8 7.11L4 8.78V18h16v-9.22l-8 4.33z"/>
                    </svg>
                </button>
                <button class="p-2 rounded-full hover:bg-ythover">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
                    </svg>
                </button>
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-purple-600 to-pink-500 flex items-center justify-center text-white font-medium text-sm hover:ring-2 hover:ring-purple-400 transition">
                    N
                </div>
            </div>
        </div>
    </header>

    <!-- Main layout: sidebar + content -->
    <div class="flex flex-1 pt-header">

        <!-- Sidebar (desktop visible, mobile hidden or toggle later) -->
        <aside class="hidden lg:block w-60 bg-ytdark border-r border-ytborder overflow-y-auto">
            <nav class="py-3">
                <a href="/" class="flex items-center gap-6 px-6 py-3.5 hover:bg-ythover transition">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                    <span class="font-medium">Home</span>
                </a>
                <a href="#" class="flex items-center gap-6 px-6 py-3.5 hover:bg-ythover transition">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 18v-6l5 3-5 3zM6 6h12v2H6z"/></svg>
                    <span>Shorts</span>
                </a>
                <!-- மேலும் items சேர்க்கலாம் -->
            </nav>
        </aside>

        <!-- Main content area -->
        <main class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8">
            {% block content %}
            {% endblock %}
        </main>
    </div>

</body>
</html>

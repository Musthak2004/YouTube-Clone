<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — YouClone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg:      #080808;
            --card:    #111111;
            --card2:   #161616;
            --border:  rgba(255,255,255,0.08);
            --accent:  #ff0033;
            --text:    #f0f0f0;
            --muted:   #777;
            --input-bg: #0e0e0e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* ── BG ORBS ── */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
        }
        .orb-1 {
            width: 500px; height: 500px;
            background: rgba(255,0,51,0.055);
            top: -100px; left: -100px;
            animation: drift 10s ease-in-out infinite;
        }
        .orb-2 {
            width: 350px; height: 350px;
            background: rgba(255,80,40,0.04);
            bottom: -80px; right: -80px;
            animation: drift 13s ease-in-out infinite reverse;
        }
        @keyframes drift {
            0%,100% { transform: translate(0,0); }
            50%      { transform: translate(30px, -30px); }
        }

        /* ── WRAPPER ── */
        .login-wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            animation: fadeUp 0.5s ease both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── BRAND TOP ── */
        .brand-top {
            text-align: center;
            margin-bottom: 32px;
        }
        .brand-icon {
            font-size: 2.8rem;
            color: var(--accent);
            filter: drop-shadow(0 0 16px rgba(255,0,51,0.45));
            display: block;
            margin-bottom: 10px;
        }
        .brand-name {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .brand-name span { color: var(--muted); font-weight: 300; }

        /* ── CARD ── */
        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 32px 80px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        /* top accent line */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,0,51,0.4), transparent);
        }

        .card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .card-subtitle {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 28px;
        }

        /* ── ALERT ── */
        .alert-error {
            background: rgba(255,0,51,0.08);
            border: 1px solid rgba(255,0,51,0.2);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.85rem;
            color: #ff6680;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-info-box {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.82rem;
            color: var(--muted);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── FORM ── */
        .field-group { margin-bottom: 18px; }

        .field-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: #aaa;
            margin-bottom: 8px;
            letter-spacing: 0.2px;
        }

        .field-wrap {
            position: relative;
        }

        .field-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 1rem;
            pointer-events: none;
            transition: color 0.2s;
        }

        .field-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            padding: 12px 14px 12px 40px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            -webkit-appearance: none;
        }

        .field-input::placeholder { color: #444; }

        .field-input:focus {
            border-color: rgba(255,0,51,0.35);
            box-shadow: 0 0 0 3px rgba(255,0,51,0.08);
        }

        .field-input:focus + .field-icon,
        .field-wrap:focus-within .field-icon {
            color: #ff6680;
        }

        /* password toggle */
        .pwd-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 0;
            transition: color 0.2s;
        }
        .pwd-toggle:hover { color: var(--text); }

        /* ── FORGOT ── */
        .forgot-row {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 24px;
        }
        .forgot-link {
            font-size: 0.8rem;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .forgot-link:hover { color: var(--text); }

        /* ── SUBMIT BTN ── */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #ff0033, #ff4444);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(255,0,51,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 28px rgba(255,0,51,0.38);
        }
        .btn-submit:active { transform: translateY(0); }

        /* ── DIVIDER ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
        }
        .divider-line { flex: 1; height: 1px; background: var(--border); }
        .divider-text { font-size: 0.75rem; color: var(--muted); }

        /* ── SIGNUP LINK ── */
        .signup-row {
            text-align: center;
            font-size: 0.875rem;
            color: var(--muted);
        }
        .signup-link {
            color: #ff4466;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .signup-link:hover { color: var(--accent); }

        @media (max-width: 480px) {
            .login-card { padding: 28px 20px; }
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="login-wrap">

        <!-- Brand -->
        <div class="brand-top">
            <i class="bi bi-youtube brand-icon"></i>
            <div class="brand-name">YouTube<span>Clone</span></div>
        </div>

        <!-- Card -->
        <div class="login-card">
            <div class="card-title">Welcome back</div>
            <div class="card-subtitle">Sign in to your account to continue</div>

            <!-- Error -->
            {% if form.errors %}
                <div class="alert-error">
                    <i class="bi bi-exclamation-circle-fill"></i>
                    Invalid username or password. Please try again.
                </div>
            {% endif %}

            <!-- Redirect notice -->
            {% if next %}
                <div class="alert-info-box">
                    <i class="bi bi-lock"></i>
                    Please sign in to access that page.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <!-- Username -->
                <div class="field-group">
                    <label class="field-label" for="{{ form.username.id_for_label }}">Username</label>
                    <div class="field-wrap">
                        <input
                            type="text"
                            name="{{ form.username.name }}"
                            class="field-input"
                            id="{{ form.username.id_for_label }}"
                            placeholder="Enter your username"
                            autofocus
                            required
                            value="{{ form.username.value|default:'' }}">
                        <i class="bi bi-person field-icon"></i>
                    </div>
                </div>

                <!-- Password -->
                <div class="field-group">
                    <label class="field-label" for="{{ form.password.id_for_label }}">Password</label>
                    <div class="field-wrap">
                        <input
                            type="password"
                            name="{{ form.password.name }}"
                            class="field-input"
                            id="{{ form.password.id_for_label }}"
                            placeholder="Enter your password"
                            required
                            id="passwordField">
                        <i class="bi bi-lock field-icon"></i>
                        <button type="button" class="pwd-toggle" id="pwdToggle" title="Show/hide password">
                            <i class="bi bi-eye" id="pwdIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Forgot -->
                <div class="forgot-row">
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-submit">
                    <i class="bi bi-box-arrow-in-right"></i> Sign in
                </button>
            </form>

            <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-text">New here?</span>
                <div class="divider-line"></div>
            </div>

            <div class="signup-row">
                Don't have an account?
                <a href="{% url 'signup' %}" class="signup-link">Create one free →</a>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        // Password toggle
        const toggle   = document.getElementById('pwdToggle');
        const pwdField = document.querySelector('input[type="password"]');
        const pwdIcon  = document.getElementById('pwdIcon');

        toggle.addEventListener('click', () => {
            const isHidden = pwdField.type === 'password';
            pwdField.type = isHidden ? 'text' : 'password';
            pwdIcon.className = isHidden ? 'bi bi-eye-slash' : 'bi bi-eye';
        });
    </script>
</body>
</html>

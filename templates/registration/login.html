<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - YouClone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
            color: #f1f1f1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #181818;
            border: 1px solid #303030;
            max-width: 420px;
            width: 100%;
        }
        .btn-red {
            background-color: #c00;
            border-color: #c00;
        }
        .btn-red:hover {
            background-color: #a00;
            border-color: #a00;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="text-center mb-5">
        <i class="bi bi-youtube text-danger" style="font-size: 5.5rem;"></i>
        <h3 class="mt-2 fw-bold">YouClone</h3>
        <p class="text-secondary">Sign in to continue</p>
    </div>

    <div class="card mx-auto shadow">
        <div class="card-body p-4 p-md-5">

            <h5 class="text-center mb-4">Sign in</h5>

            {% if form.errors %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    Invalid username or password.
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endif %}

            {% if next %}
                <div class="alert alert-info mb-3">
                    Please sign in to see this page.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="{{ form.username.id_for_label }}" class="form-label">Username or email</label>
                    <input type="text"
                           name="{{ form.username.name }}"
                           class="form-control bg-dark border-secondary text-white"
                           id="{{ form.username.id_for_label }}"
                           placeholder="Username or email"
                           autofocus
                           required
                           value="{{ form.username.value|default:'' }}">
                </div>

                <div class="mb-4">
                    <label for="{{ form.password.id_for_label }}" class="form-label">Password</label>
                    <input type="password"
                           name="{{ form.password.name }}"
                           class="form-control bg-dark border-secondary text-white"
                           id="{{ form.password.id_for_label }}"
                           placeholder="Password"
                           required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-red btn-lg">Sign in</button>
                </div>
            </form>

            <div class="text-center mt-4 small">
                <a href="#" class="text-info text-decoration-none">Forgot password?</a>
            </div>

            <hr class="border-secondary my-4">

            <p class="text-center mb-0">
                Don't have an account?
                <a href="{% url 'signup' %}" class="text-danger text-decoration-none fw-medium">Create account</a>
            </p>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>

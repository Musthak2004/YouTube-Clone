{% extends "base.html" %}

{% block title %}Email Sent — YouTube Clone{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 440px;">
  <div class="card text-center" style="background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden;">
    <div class="card-body px-4 py-5">
      <div style="font-size: 3rem; margin-bottom: 16px; color: var(--accent);">
        <i class="bi bi-envelope-check"></i>
      </div>
      <h4 class="fw-bold mb-2" style="font-family: 'Outfit', sans-serif;">Check Your Email</h4>
      <p style="font-size: 0.875rem; color: var(--text-muted); max-width: 320px; margin: 0 auto 24px;">
        We've sent instructions for resetting your password. You should receive them shortly.
      </p>
      <a href="{% url 'login' %}" class="btn" style="
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 10px 28px;
        font-family: 'Outfit', sans-serif;
        font-weight: 600;
        text-decoration: none;
      ">
        <i class="bi bi-box-arrow-in-right me-1"></i> Back to Sign In
      </a>
    </div>
  </div>
</div>
{% endblock %}

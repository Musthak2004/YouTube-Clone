{% extends 'base.html' %}
{% block title %}Delete Channel - YouClone{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">

            <div class="card bg-dark border-danger text-center p-5 shadow-lg rounded-4">
                <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-4"></i>

                <h3 class="text-danger mb-4">Delete Channel?</h3>

                <p class="lead mb-4">
                    Are you sure you want to delete <strong>"{{ channel.name }}"</strong>?<br>
                    All videos and data will be permanently removed.
                </p>

                <p class="text-muted mb-5">
                    This action cannot be undone.
                </p>

                <form method="post" class="d-grid gap-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-lg rounded-pill">
                        <i class="bi bi-trash me-2"></i> Yes, Delete Channel
                    </button>
                    <a href="{{ channel.get_absolute_url }}" class="btn btn-outline-secondary btn-lg rounded-pill">
                        Cancel
                    </a>
                </form>
            </div>

        </div>
    </div>
</div>

{% endblock %}

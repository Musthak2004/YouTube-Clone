{% extends 'base.html' %}
{% block title %}Delete Comment - YouClone{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">

            <div class="card bg-dark border-danger text-center p-5 shadow-lg">
                <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-4"></i>

                <h3 class="text-danger mb-4">Delete Comment?</h3>

                <p class="lead mb-4">
                    Are you sure you want to delete this comment?<br>
                    <small class="text-secondary">"{{ comment.text|truncatechars:100 }}"</small>
                </p>

                <p class="text-muted mb-5">
                    This action cannot be undone.
                </p>

                <form method="post" class="d-grid gap-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-lg">
                        <i class="bi bi-trash me-2"></i> Yes, Delete
                    </button>
                    <a href="{{ comment.video.get_absolute_url }}" class="btn btn-outline-secondary btn-lg">
                        Cancel
                    </a>
                </form>
            </div>

        </div>
    </div>
</div>

{% endblock %}
